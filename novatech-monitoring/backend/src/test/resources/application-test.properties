# ============================================================
# NOVA TECH - Configuracion para las pruebas automaticas
# ============================================================
# La ruta de la base de datos la fija ApiTestSupport: un archivo aparte en
# target/test-data/, que se borra al comenzar cada ejecucion. Asi las pruebas
# nunca tocan data/novatech.db.

# Clave de dispositivo propia de las pruebas.
novatech.ingest.api-key=clave-dispositivo-pruebas

# Consola mas silenciosa mientras corren las pruebas.
logging.level.com.novatech=WARN
logging.level.org.springframework=WARN
