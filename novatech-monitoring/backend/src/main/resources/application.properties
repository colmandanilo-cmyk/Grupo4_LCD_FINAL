# ============================================================
# NOVA TECH - Configuracion del backend
# ============================================================
spring.application.name=novatech-backend
spring.main.banner-mode=off

# Servidor: solo escucha en esta computadora (no queda expuesto a la red
# local y Windows no pide permiso al firewall).
server.address=127.0.0.1
server.port=8080
server.error.include-stacktrace=never

# ---------------- Base de datos SQLite ----------------
# Ruta del archivo, relativa a la carpeta desde donde se ejecuta el backend.
# La conexion la arma DatabaseConfig (crea la carpeta si no existe).
novatech.db.path=data/novatech.db

# Crea las tablas al arrancar (CREATE TABLE IF NOT EXISTS).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.encoding=UTF-8

# ---------------- Seguridad ----------------
# Duracion del token de sesion (un turno de monitoreo).
novatech.security.jwt-expiration-hours=8
# Clave que deben enviar los dispositivos (simulador o equipos reales) en la
# cabecera X-Device-Key. Valor de demostracion: cambiar en una instalacion real
# o definir la variable de entorno NOVATECH_INGEST_API_KEY.
novatech.ingest.api-key=${NOVATECH_INGEST_API_KEY:novatech-sim-2026}
# Origenes permitidos para el navegador (servidor de desarrollo de Vite).
novatech.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# ---------------- Retencion de datos ----------------
novatech.retention.telemetry-days=7
novatech.retention.history-days=30

# Si es true, el backend crea y carga la base de datos y termina.
# Lo usan install.bat y reset_demo.bat.
novatech.exit-after-init=false

# ---------------- Registro en consola ----------------
logging.level.root=WARN
logging.level.com.novatech=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{0} - %msg%n
